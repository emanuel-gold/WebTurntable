# arduino-cli build profiles. They pin the core and library versions so a
# compile check gives the same result every time:
#
#   arduino-cli compile --profile esp32 code/WebTurntable
#
# Arduino IDE 2 ignores profiles. To build from the IDE, install the same
# versions through the Boards Manager and Library Manager.
profiles:
  esp32:
    notes: ESP32 DevKit V1 as "ESP32 Dev Module", Minimal SPIFFS partitions (1.9 MB app with OTA, 128 KB file system)
    fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ESP Async WebServer (3.12.1)
      - Async TCP (3.5.0)
      - ArduinoJson (7.4.3)

default_profile: esp32
